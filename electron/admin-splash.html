<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verity Admin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    html, body {
      background: transparent !important;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .splash-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: entrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .wordmark-wrap {
      position: relative;
      display: inline-block;
      padding: 15px 30px 10px;
    }

    /* Core floating wordmark */
    .wordmark {
      font-size: 84px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1;
      white-space: nowrap;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.85)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95));
      display: flex;
      align-items: center;
    }

    .letter-v {
      color: #3b82f6;
      display: inline-block;
      text-shadow: 
        0 0 18px rgba(59, 130, 246, 0.95),
        0 0 40px rgba(37, 99, 235, 0.75),
        0 0 75px rgba(29, 78, 216, 0.5);
      animation: vPulse 1.8s ease-in-out infinite alternate;
    }

    .letter-erity {
      color: #ffffff;
      display: inline-block;
      text-shadow: 
        0 0 18px rgba(255, 255, 255, 0.45),
        0 0 35px rgba(59, 130, 246, 0.4);
    }

    .admin-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(30, 58, 138, 0.8);
      border: 1px solid rgba(96, 165, 250, 0.5);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    }

    .admin-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #60a5fa;
      box-shadow: 0 0 8px #60a5fa;
    }

    /* High-intensity light flash sheen across the letters */
    .wordmark-flash {
      position: absolute;
      top: 15px;
      left: 30px;
      right: 30px;
      bottom: 10px;
      font-size: 84px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      display: flex;
      align-items: center;
      background: linear-gradient(
        110deg,
        transparent 0%,
        transparent 28%,
        rgba(255, 255, 255, 0.98) 50%,
        rgba(96, 165, 250, 0.9) 55%,
        transparent 72%,
        transparent 100%
      );
      background-size: 260% 100%;
      background-position: 160% 0;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: sheenFlash 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards;
    }

    /* Radiant optical flare burst */
    .flash-flare {
      position: absolute;
      top: 45%;
      left: 30px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(96, 165, 250, 0.85) 25%, rgba(37, 99, 235, 0.35) 50%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(3px);
      animation: flareBurst 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    @keyframes entrance {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes vPulse {
      0% {
        text-shadow: 
          0 0 18px rgba(59, 130, 246, 0.9),
          0 0 40px rgba(37, 99, 235, 0.65),
          0 0 70px rgba(29, 78, 216, 0.4);
      }
      100% {
        text-shadow: 
          0 0 24px rgba(96, 165, 250, 1),
          0 0 55px rgba(59, 130, 246, 0.9),
          0 0 90px rgba(37, 99, 235, 0.65);
      }
    }

    @keyframes sheenFlash {
      0% {
        background-position: 160% 0;
        opacity: 1;
      }
      75% {
        background-position: -20% 0;
        opacity: 1;
      }
      100% {
        background-position: -60% 0;
        opacity: 0;
      }
    }

    @keyframes flareBurst {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        left: 45px;
      }
      20% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 1;
        left: 70px;
      }
      55% {
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.85;
        left: 200px;
      }
      80% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 0.2;
        left: 290px;
      }
      100% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        left: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="wordmark-wrap">
      <div class="wordmark">
        <span class="letter-v">V</span><span class="letter-erity">erity</span>
      </div>

      <div class="wordmark-flash" aria-hidden="true">
        <span class="letter-v">V</span><span class="letter-erity">erity</span>
      </div>

      <div class="flash-flare" aria-hidden="true"></div>
    </div>
    <div class="admin-pill">
      <span class="admin-pill-dot"></span>
      <span>Admin Control Center</span>
    </div>
  </div>
</body>
</html>
